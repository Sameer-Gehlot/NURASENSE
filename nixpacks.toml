# Nixpacks configuration for NuraSense Railway deployment
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = ["python -m pip install --no-cache-dir -r requirements.txt"]

[phases.build]
cmds = []

[start]
cmd = "python -m uvicorn ecg_cloud_server:app --host 0.0.0.0 --port ${PORT:-8080}"
